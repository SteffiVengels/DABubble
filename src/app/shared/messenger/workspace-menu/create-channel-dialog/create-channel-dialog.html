<dialog #dialog class="create-channel" (click)="closeOnBackdrop($event)" (close)="reset()">
    <div class="create-channel-inner">
        <div class="create-channel-top">
            <p>{{ step() === 'form' ? 'Channel erstellen' : 'Leute hinzufügen' }}</p>
            <button class="close" (click)="close()"></button>
        </div>
        @if(step() === 'form') {
        <p>Channels dienen deinem Team zur Kommunikation. Am besten sollten sie themenbezogen sein #marketing zum
            Beispiel.</p>
        <form [formGroup]="createChannelForm">
            <div class="input-fields">
                <label for="name">Channel-Name</label>
                <div class="input">
                    <span class="icon" aria-hidden="true">#</span>
                    <input type="text" id="name" formControlName="name" placeholder="z.B. Kooperationsprojekte">
                </div>
            </div>
            <div class="input-fields">
                <label for="description">Beschreibung <span>(optional)</span></label>
                <div class="input">
                    <input type="text" id="description" formControlName="description" placeholder="Dein Text hier">
                </div>
            </div>
            <div class="submit-div">
                <button type="submit" [disabled]="!createChannelForm.valid" (click)="goToMembers()">Erstellen</button>
            </div>
        </form>
        } @else {
        <label>
            <input type="radio" name="memberMode" [checked]="memberMode() === 'all'" (change)="memberMode.set('all')">
            Alle Mitglieder von <span class="highlight">Devspace</span> hinzufügen
        </label>
        <label>
            <input type="radio" name="memberMode" [checked]="memberMode() === 'specific'"
                (change)="memberMode.set('specific')">
            Bestimmte Leute hinzufügen
        </label>
        @if (memberMode() === 'specific') {
        <div class="input-fields">
            <label class="d_none" for="name">Name</label>
            <div class="input">
                <input type="text" id="name" formControlName="name" placeholder="Name eingeben">
            </div>
        </div>
        }
        <div class="submit-div"><button>Erstellen</button></div>
        }
    </div>
</dialog>
