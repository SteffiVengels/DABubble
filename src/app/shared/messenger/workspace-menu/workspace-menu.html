<div class="workspace-menu">
    <div class="workspace-menu-logo">
        <img src="/img/workspace_logo.png" alt="workspace-logo">
        <p>Devspace</p>
    </div>
    <button class="workspace-menu-button">
    </button>
</div>
<div class="scroll-area">
    <details class="workspace-menu-details" open>
        <summary class="summary">

            <div>
                <span class="arrow"></span>
                <span class="channel-icon"></span>
                <p>Channels</p>
            </div>
            <button class="add-channel-button" (click)="createChannel.showModal()">
            </button>
        </summary>
        <button class="channel">
            <span></span>
            <p>Entwicklerteam</p>
        </button>
        <button class="add-channel" (click)="createChannel.showModal()">
            <span></span>
            <p>Channel hinzufügen</p>
        </button>
    </details>
    <details class="workspace-menu-details" open>
        <summary class="summary">
            <div>
                <span class="arrow"></span>
                <span class="account-icon"></span>
                <p>Direktnachricht</p>
            </div>
        </summary>
        @for (user of supabase.directMessageUsers(); track user.id) {
        <button class="direct-message">
            <div class="profile-img">
                <img [src]="user.avatar" alt="Profilbild">
                <div class="status" [class.online]="supabase.isOnline(user.id)"></div>
            </div>
            <p>{{ user.name }} @if (user.id === supabase.currentUserId()) { <span>(Du)</span> }</p>
        </button>
        }
    </details>
</div>

<dialog #createChannel class="create-channel" (click)="closeOnBackdrop($event, createChannel)">
    <div class="create-channel-inner">
        <div class="create-channel-top">
            <p>Channel erstellen</p>
            <button class="close" (click)="createChannel.close()"></button>
        </div>
        <p>Channels dienen deinem Team zur Kommunikation. Am besten sollten sie themenbezogen sein #marketing zum
            Beispiel.</p>
        <form [formGroup]="createChannelForm">
            <div class="input-fields">
                <label for="name">Channel-Name</label>
                <div class="input">
                    <span class="icon" aria-hidden="true">#</span>
                    <input type="text" id="name" formControlName="name" placeholder="z.B. Kooperationsprojekte">
                </div>
            </div>
            <div class="input-fields">
                <label for="description">Beschreibung <span>(optional)</span></label>
                <div class="input">
                    <input type="text" id="description" formControlName="description" placeholder="Dein Text hier">
                </div>

            </div>
            <div class="submit-div">
                <button type="submit" [disabled]="!createChannelForm.valid">Erstellen</button>
            </div>
        </form>
    </div>
</dialog>
