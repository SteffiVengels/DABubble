<form class="input-wrapper" (ngSubmit)="onSubmit()" [formGroup]="messageForm">
    <textarea name="message" rows="2" [placeholder]="placeholder()" formControlName="text"
        (keydown.enter)="onEnter($event)"></textarea>
    <div class="message-buttons">
        <div class="message-buttons-wrapper">
            <button type="button" class="reaction-icon" aria-label="Emoji einfügen"
                (click)="toggleEmojiPicker(); $event.stopPropagation()"></button>
            <button type="button" class="at-icon" aria-label="Person erwähnen"></button>
            @if (emojiPickerOpen()) {
            <app-emoji-picker (emojiSelected)="addEmoji($event)" />
            }
        </div>
        <button type="submit" class="send-button" aria-label="Nachricht senden"
            [disabled]="messageForm.invalid"></button>
    </div>
</form>
