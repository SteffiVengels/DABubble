<header>
    <div class="logo">
        <a routerLink="/">
            <img src="favicon.png" alt="">
            <img class="logo_name" src="/img/Logo_name.png" alt="Zur Startseite">
        </a>
    </div>
    <div class="search">
        <input type="text" placeholder="Devspace durchsuchen">
        <img src="/img/icons/search.png" alt="Suche">
    </div>
    <div class="profile">
        <p class="profile_name">Frederik Beck</p>
        <div class="profile_img">
            <img src="/img/men4.png" alt="Profilbild">
            <div class="status online"></div>
        </div>
        <img class="profile_icon" src="/img/icons/keyboard_arrow_down.png" alt="Dropdown">
    </div>
</header>
<section class="messenger">
    @if (isOpen) {
    <nav id="workspace-nav">
        <app-workspace-menu></app-workspace-menu>
    </nav>
    }
    <main><app-main-chat></app-main-chat></main>
    <aside>
        <app-secondary-chat></app-secondary-chat>
    </aside>
</section>
<button type="button" class="workspace-menu-toggle" aria-controls="workspace-nav" [attr.aria-expanded]="isOpen"
    (click)="isOpen = !isOpen">
    <span>{{ isOpen ? 'Workspace-Menü schließen' : 'Workspace-Menü öffnen' }}</span>
    <img class="icon" [src]="isOpen ? '/img/icons/Show-navigation.png' : '/img/icons/Hide-navigation.png'" alt="">
    <img class="icon-hover"
        [src]="isOpen ? '/img/icons/Show-navigation-hover.png' : '/img/icons/Hide-navigation-hover.png'" alt="">
</button>
