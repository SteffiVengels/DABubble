<header>
    <div class="logo">
        <a routerLink="/">
            <img src="favicon.png" alt="">
            <img class="logo-name" src="/img/logo_name.png" alt="Zur Startseite">
        </a>
    </div>
    <div class="search">
        <input type="text" placeholder="Devspace durchsuchen">
        <img src="/img/icons/search.png" alt="Suche">
    </div>

    <div class="profile">
        <button class="profile-dropdown" (click)="profileMenu.showModal()" aria-haspopup="dialog">
            @if (supabase.currentUser(); as user) {
            <p class="profile-name">{{ user.name }}</p>
            <div class="profile-img">
                <img [src]="user.avatar" alt="Profilbild">
                <div class="status" [class.online]="supabase.isOnline(user.id)"></div>
            </div>
            }
            <span class="profile-icon"></span>
        </button>
    </div>

    <dialog #profileMenu class="profile-menu" (click)="closeOnBackdrop($event, profileMenu)">
        <div class="overlay-profil">
            @if (supabase.currentUser()?.email !== supabase.guestEmail) {
            <button (click)="profileDialog.open()">Profil</button>
            }
            <button (click)="signOut()">Log out</button>
        </div>
    </dialog>

    <app-profile-dialog #profileDialog />

</header>
<section class="messenger">
    @if (isOpen) {
    <nav id="workspaceNav">
        <app-workspace-menu></app-workspace-menu>
    </nav>
    }
    <main><app-main-chat></app-main-chat></main>
    <aside>
        <app-secondary-chat></app-secondary-chat>
    </aside>
</section>
<button type="button" class="workspace-menu-toggle" aria-controls="workspaceNav" [attr.aria-expanded]="isOpen"
    (click)="isOpen = !isOpen">
    <span>{{ isOpen ? 'Workspace-Menü schließen' : 'Workspace-Menü öffnen' }}</span>
    <img class="icon" [src]="isOpen ? '/img/icons/show_navigation.png' : '/img/icons/hide_navigation.png'" alt="">
    <img class="icon-hover"
        [src]="isOpen ? '/img/icons/show_navigation_hover.png' : '/img/icons/hide_navigation_hover.png'" alt="">
</button>
