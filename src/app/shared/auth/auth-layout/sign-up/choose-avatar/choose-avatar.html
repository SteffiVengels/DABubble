<form (submit)="$event.preventDefault(); confirmAvatar()">
    <a class="go-back" href="" (click)="$event.preventDefault(); goBack.emit()"></a>
    <h1 class="auth-headline">Wähle deinen Avatar</h1>
    <div class="img-wrapper">
        <img class="avatar-big" [src]="selectedAvatar()" alt="">
        <div class="avatar-wrapper">
            <p class="headline3">{{ name() }}</p>
            <p>Aus der Liste Wählen</p>
            <ul class="avatar-list">
                @for (avatar of avatars; track avatar) {
                <li (click)="selectedAvatar.set(avatar)"><img [src]="avatar" alt="Avatar"></li>
                }
            </ul>
        </div>
    </div>

    <button class="next-btn" type="submit">Weiter</button>
</form>
