<form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <a class="go-back" routerLink="/auth/login"></a>
    <h1 class="auth-headline">Passwort zurücksetzen</h1>

    <p>Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

    <!-- E-Mail -->
    <div class="width-100">
        <div class="field">
            <label for="email">E-Mail-Adresse</label>
            <span class="icon" aria-hidden="true"><img src="/img/icons/mail.png" alt=""></span>
            <input type="email" id="email" name="email" formControlName="email" autocomplete="email" placeholder="beispielname@email.com"
                required aria-describedby="auth-hint email-error" aria-invalid="false" />
        </div>
        @if (resetPasswordForm.get('email')?.invalid && resetPasswordForm.get('email')?.touched) {
        <p id="email-error" class="error" role="alert">
            Diese E-Mail-Adresse ist leider ungültig.
        </p>
        }
    </div>


    <p class="color-grey">Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</p>

    <button type="submit" [disabled]="!resetPasswordForm.valid">E-Mail senden</button>

</form>
