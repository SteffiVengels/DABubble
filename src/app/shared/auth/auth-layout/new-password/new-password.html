<form [formGroup]="newPasswordForm" (ngSubmit)="onSubmit()">
    <a class="go-back" routerLink="/auth/login"></a>
    <h1 class="auth-headline">Passwort zurücksetzen</h1>

    <!-- Neues Passwort -->
    <div class="width-100">
        <div class="field">
            <label for="password">Neues Passwort</label>
            <input type="password" id="password" name="password" formControlName="password" autocomplete="new-password"
                placeholder="Neues Passwort" aria-describedby="password-error" />
        </div>
        @if (newPasswordForm.get('password')?.invalid && newPasswordForm.get('password')?.touched) {
        <p id="password-error" class="error" role="alert">
            Das Passwort muss mindestens 8 Zeichen lang sein.
        </p>
        }
    </div>

    <!-- Passwort bestätigen -->
    <div class="width-100">
        <div class="field">
            <label for="confirmPassword">Passwort bestätigen</label>
            <input type="password" id="confirmPassword" name="confirmPassword" formControlName="confirmPassword"
                autocomplete="new-password" placeholder="Neues Kennwort bestätigen" aria-describedby="confirm-error" />
        </div>
        @if (passwordsMismatch()) {
        <p id="confirm-error" class="error" role="alert">
            Ihre Kennwörter stimmen nicht überein.
        </p>
        }
    </div>

    <button type="submit" [disabled]="!newPasswordForm.valid">Passwort ändern</button>

</form>
